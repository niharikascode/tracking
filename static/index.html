<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAM 3 Studio</title>
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6fed'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/><circle cx='16' cy='16' r='2.5' fill='white'/></svg>">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true"></span>
      <span>
        <span class="brand-name">SAM 3 Studio</span>
        <span class="tagline">Detect, segment and track objects in photos and videos</span>
      </span>
    </a>
    <div class="top-pills">
      <span id="budget-pill" class="pill pill-muted" title="OpenRouter credit used for object detection today" hidden></span>
      <span id="server-pill" class="pill pill-muted" role="status">Connecting…</span>
    </div>
  </header>

  <main id="app" class="page"></main>

  <!-- item viewer -->
  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-panel">
      <div class="viewer-head">
        <button type="button" class="icon-btn" id="viewer-prev" aria-label="Previous item" title="Previous (←)">‹</button>
        <h2 id="viewer-title" class="truncate"></h2>
        <button type="button" class="icon-btn" id="viewer-next" aria-label="Next item" title="Next (→)">›</button>
        <span class="spacer"></span>
        <div class="seg" id="viewer-mode" role="tablist" aria-label="Show">
          <button type="button" role="tab" data-mode="result" class="on">Result</button>
          <button type="button" role="tab" data-mode="original">Original</button>
        </div>
        <button type="button" class="icon-btn" id="viewer-close" aria-label="Close" title="Close (Esc)">✕</button>
      </div>
      <div class="viewer-body">
        <div class="stage" id="viewer-stage"></div>
        <aside class="viewer-side">
          <div id="viewer-run"></div>
          <h3 class="side-title">History</h3>
          <ul id="viewer-runs" class="run-list"></ul>
        </aside>
      </div>
    </div>
  </div>

  <dialog id="key-dialog">
    <form id="key-form">
      <h3>Access key</h3>
      <p class="muted small">This studio is private. Enter the access key you were given.</p>
      <input type="password" id="key-input" autocomplete="current-password" required>
      <p class="alert alert-error small" id="key-error" hidden></p>
      <div class="row-end"><button class="btn btn-primary" type="submit">Continue</button></div>
    </form>
  </dialog>

  <dialog id="prompt-dialog">
    <form id="prompt-form">
      <h3 id="prompt-title"></h3>
      <input type="text" id="prompt-input" maxlength="80" required>
      <div class="row-end">
        <button class="btn btn-ghost" type="button" id="prompt-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="prompt-ok">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form id="confirm-form">
      <h3 id="confirm-title"></h3>
      <p class="muted" id="confirm-text"></p>
      <div class="row-end">
        <button class="btn btn-ghost" type="button" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger-solid" type="submit" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
